
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Химический тренажёр</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Химический тренажёр</h1>
    <span id="badge"></span>
  </header>

  <main id="auth">
    <section class="panel">
      <h2>Вход и регистрация</h2>
      <form id="login">
        <label>Имя
          <input id="name" required maxlength="40">
        </label>
        <label>ID пользователя
          <input id="uid" required maxlength="32">
        </label>
        <button>Войти / зарегистрироваться</button>
      </form>

      <details>
        <summary>Вход администратора</summary>
        <form id="adminLogin">
          <label>Имя администратора
            <input id="adminName" value="Администратор" required>
          </label>
          <label>ID администратора
            <input id="adminId" value="admin" required>
          </label>
          <label>Ключ администратора
            <input id="adminKey" type="password" required>
          </label>
          <button>Войти администратором</button>
        </form>
      </details>
      <p id="authMsg"></p>
    </section>
  </main>

  <main id="app" class="hidden">
    <aside class="sidebar">
      <h2>Программы</h2>
      <input id="search" placeholder="Поиск программы">
      <nav id="programs"></nav>
      <p id="progress"></p>
      <button id="newProgram" class="admin hidden">Добавить программу</button>
      <button id="manage" class="admin hidden">Управление курсом</button>
      <button id="logout" class="light">Выйти</button>
    </aside>

    <section class="content">
      <div id="promoBox"></div>
      <div id="lesson"></div>
      <div id="adminPanel" class="hidden panel"></div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
