<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Химический тренажёр</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Химический тренажёр</h1><span id="badge"></span></header>

  <main id="auth" class="auth-wrap">
    <section class="panel auth-panel">
      <h2>Вход и регистрация</h2>
      <form id="login">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Пароль<input id="password" type="password" minlength="8" autocomplete="current-password" required></label>
        <div class="auth-buttons"><button type="submit">Войти</button><button type="button" id="signup" class="light">Создать аккаунт</button></div>
      </form>
      <p id="authMsg" role="status"></p>
    </section>
  </main>

  <main id="app" class="hidden">
    <aside class="sidebar">
      <h2>Программы</h2>
      <input id="search" placeholder="Поиск программы" aria-label="Поиск программы">
      <nav id="programs"></nav>
      <p id="progress"></p>
      <button id="newProgram" class="admin hidden">Добавить программу</button>
      <button id="manage" class="admin hidden">Управление промокодами</button>
      <button id="logout" class="light">Выйти</button>
    </aside>
    <section class="content">
      <div id="promoBox"></div>
      <div id="lesson"></div>
      <div id="adminPanel" class="hidden panel"></div>
    </section>
  </main>

  <div id="editorBackdrop" class="modal-backdrop hidden" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <button id="editorClose" type="button" class="modal-x" aria-label="Закрыть">×</button>
      <h2 id="editorTitle">Редактор</h2>
      <form id="editorForm">
        <div id="editorFields"></div>
        <div class="modal-actions"><button type="button" id="editorCancel" class="light">Отмена</button><button type="submit">Сохранить</button></div>
      </form>
    </section>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
